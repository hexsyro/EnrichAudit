[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "enrichaudit"
version = "0.1.0"
description = "Audit enriched social/content datasets for the bugs pipelines keep shipping: miscalculated engagement rates, stale fields, contradictory labels."
readme = "README.md"
license = "MIT"
authors = [{ name = "hexsyro", email = "hexsyro@gmail.com" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["data-quality", "enrichment", "engagement", "audit", "dataset", "qa"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
enrichaudit = "enrichaudit.cli:main"

[project.urls]
Homepage = "https://github.com/hexsyro/EnrichAudit"
Repository = "https://github.com/hexsyro/EnrichAudit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
